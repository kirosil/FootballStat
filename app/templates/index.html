<!DOCTYPE html>
<html lang="ru">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
        <meta charset="UTF-8">
        <script src="/static/htmx.min.js"></script>
        <script src="/static/json-enc.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <title>Луиш мать его фигу</title>
</head>
<body>
<div class="logo-box">
<img class="justify-content-start" src="{{ url_for('static', path='/images/Premier_League_Logo.webp') }}"
     style="max-height: 100px;">
    <div class="buttons">
        <a class="my-button" href="/graph">Форма команды</a>
        <a class="my-button" href="/compare">Сравнение команды</a>
    </div>
</div>
<div class="container mt-5">
<script>
    window.TeamId=33;
    function save(value, teamsJson)
    {
        const teams = JSON.parse(teamsJson);
        TeamId=value
        const img=document.getElementById("team_logo");
        img.src = "https://media.api-sports.io/football/teams/" + value + ".png";
        document.getElementById("team_logo_text").textContent=teams[value];

    }
</script>

<script>
    window.MatchCount=1
    save_count=function (value)
    {
        MatchCount=value
    }
</script>

<script>
    window.HowShow=1;
    save_how_show =function(value)
    {
        HowShow=value
    }
</script>

<script>
    window.WherePlayed=3;
    save_where_played =function(value)
    {
        WherePlayed=value
    }
</script>

<script>
    window.AllStatsSet=new Set()
    window.AllStatsArray=[]
    save_stat=function (value, flag)
    {
        if(flag)
        {
            AllStatsSet.add(value)
        }
        else
        {
            AllStatsSet.delete(value)
        }
        AllStatsArray=[...AllStatsSet]
    }
</script>
<script>
    const trans = {
        "shots": "Удары",
        "shots_on_goal": "Удары в створ",
        "offsides": "Оффсайды",
        "corners": "Угловые",
        "yellow_cards": "Желтые карточки",
        "red_cards": "Красные карточки",
        "possession": "Владение мячом"
    };
        const reverse_trans=
        {
    "Удары": "shots",
    "Удары в створ": "shots_on_goal",
    "Оффсайды": "offsides",
    "Угловые": "corners",
    "Желтые карточки": "yellow_cards",
    "Красные карточки": "red_cards",
    "Владение мячом": "possession"
    };
    const icons = {
    "shots": "{{ url_for('static', path='/images/shot.png') }}",
    "shots_on_goal": "{{ url_for('static', path='/images/shot-on-target.png') }}",
    "offsides": "{{ url_for('static', path='/images/offside.png') }}",
    "corners": "{{ url_for('static', path='/images/corner.png') }}",
    "yellow_cards": "{{ url_for('static', path='/images/yellow-card.png') }}",
    "red_cards": "{{ url_for('static', path='/images/red-card.png') }}",
    "possession": "{{ url_for('static', path='/images/possession.svg') }}"
};
    PutStat=function (event)
    {
        const data = JSON.parse(event.detail.xhr.responseText);
        let n=7;
        let k=0;
        let count=0;
        for (let i=0;i<7;i++) {
            if(i<AllStatsArray.length) {
                if(AllStatsArray[i]=="possession")
                {
                     document.getElementById("6").textContent = trans[AllStatsArray[i]];
                     document.getElementById("13").textContent =data[i]+"%";
                     const box = document.getElementById("20");
                      if(box.childElementCount==0) {
                          const img = document.createElement("img");
                          img.src = "{{ url_for('static', path='/images/possession.png') }}";
                          img.className = "stat-icon";
                          box.appendChild(img);
                      }
                }
                else {
                    const statName = AllStatsArray[i];
                    const textDiv = document.getElementById(k.toString())
                    const box = document.getElementById((k + 14).toString());

                    if(box.childElementCount==0|| statName!=reverse_trans[textDiv.textContent] || window.Is_chage) {
                        document.getElementById((k + 7).toString()).textContent = data[i];
                        textDiv.textContent = trans[statName];

                        if (box.childElementCount!= 0) {
                            document.getElementById("id_to_remove"+k.toString()).remove();
                        }
                        const img = document.createElement("img");
                            img.src = icons[statName];
                            img.id="id_to_remove"+k.toString();
                            img.className = "stat-icon";
                            box.appendChild(img);

                    }
                        k++;

                }
            }
            else{
                document.getElementById(k.toString()).textContent = "";
                document.getElementById((k+7).toString()).textContent="";
                document.getElementById((k+14).toString()).textContent="";
                k++;
            }
        }
    }
</script>



    </div>
 <div class="d-flex justify-content-between align-items-start gap-4">
        <div style="min-width: 200px;">
            <label for="teams" class="mb-2">Выберите команду</label>
            <select id="teams" name="teams" class=" my-button form-select mb-3" data-teams='{{ teams | tojson }}' onchange="save(this.value, this.dataset.teams)">
                {% for item in teams %}
                    <option value="{{ item }}">{{ teams[item][0] }}</option>
                {% endfor %}
            </select>
    <div class="card custom-card p-4 d-flex align-items-center">
            <img class="img-fluid d-block mx-auto mb-2" id="team_logo" src="" style="max-height: 70px;">
                <div id="team_logo_text" class="number-style">
                    </div>
            </div>
        </div>

        <div class="d-flex gap-3 flex-wrap justify-content-center">
            <div>
                <label for="count" class="mb-2">Кол-во матчей</label>
                <select id="count" name="count" class="my-button form-select" onchange="save_count(this.value)">
                    {% for i in range(1,38) %}
                        <option value="{{i}}">{{i}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-2">Как показать</label>
                <select class="my-button form-select" onchange="save_how_show(this.value)">
                    <option value="{{1}}">AVG</option>
                    <option value="{{2}}">MIN</option>
                    <option value="{{3}}">MAX</option>
                </select>
            </div>
            <div>
                <label class="mb-2">Дома/в гостях</label>
                <select class="my-button form-select" onchange="save_where_played(this.value)">
                    <option value="{{3}}">Все</option>
                    <option value="{{1}}">Дома</option>
                    <option value="{{2}}">В гостях</option>
                </select>
            </div>
        </div>
<div class="d-flex justify-content-center mb-3" style="margin-top: 29px;">
    <button class="my-button"
    hx-post="/stats/team"
    hx-ext="json-enc"
     hx-swap="none"
    hx-vals='js:{
            name: "Team 40",
            team_id: TeamId,
            matches_count: MatchCount,
            where_played: WherePlayed,
            how_show: HowShow,
            stats: AllStatsArray
        }'
    hx-on::after-request="PutStat(event)"
    style="">
    Посмотреть статистику
</button>
</div>
        <div class="d-flex flex-column gap-2 text-end" style="min-width: 200px;">
            <div>
                <label>
                    <input type="checkbox" value="shots" onchange="save_stat(this.value, this.checked)"> Удары
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="shots_on_goal" onchange="save_stat(this.value, this.checked)"> Удары в створ
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="offsides" onchange="save_stat(this.value, this.checked)"> Оффсайды
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="corners" onchange="save_stat(this.value, this.checked)"> Угловые
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="yellow_cards" onchange="save_stat(this.value, this.checked)"> Желтые карточки
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="red_cards" onchange="save_stat(this.value, this.checked)"> Красные карточки
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="possession" onchange="save_stat(this.value, this.checked)"> Владение мячом
                </label>
            </div>
        </div>
    </div>
</div>

<div class="box-for-stat">
  <div class="stat-box">
    <div id="0" class="stat-style text-center"></div>
    <div id="7" class="number-style text-center"></div>
      <div id="14"></div>
  </div>
  <div class="stat-box">
    <div id="1" class="text-center stat-style"></div>
    <div id="8" class="number-style text-center"></div>
      <div id="15"></div>
  </div>
  <div class="stat-box">
    <div id="2" class="text-center stat-style"></div>
    <div id="9" class="number-style text-center"></div>
      <div id="16"></div>
  </div>
</div>
<div class="box-for-stat">
  <div class="stat-box">
    <div id="3" class="text-center stat-style"></div>
    <div id="10" class="number-style text-center"></div>
      <div id="17"></div>
  </div>
  <div class="stat-box">
    <div id="4" class="text-center stat-style"></div>
    <div id="11" class="number-style text-center"></div>
      <div id="18"></div>
  </div>
  <div class="stat-box">
    <div id="5" class="text-center stat-style"></div>
    <div id="12" class="number-style text-center"></div>
      <div id="19"></div>
  </div>
</div>
<div class="box-for-stat">
  <div class="stat-box">
    <div id="6" class="text-center stat-style"></div>
    <div id="13" class="number-style text-center"></div>
      <div id="20"></div>
  </div>
</div>
</div>
</body>
</html>
