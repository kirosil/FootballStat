<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
        <meta charset="UTF-8">
        <script src="/static/htmx.min.js"></script>
        <script src="/static/json-enc.js"></script>
    <title>Луиш мать его фигу</title>
</head>
<body class="bg-light">
<div class="container mt-5">
<script>
    window.TeamId=41;
    function save(value)
    {
        TeamId=value
        const img=document.getElementById("team_logo");
        img.src = "https://media.api-sports.io/football/teams/" + value + ".png";
    }
</script>

<script>
    window.MatchCount=1
    save_count=function (value)
    {
        MatchCount=value
    }
</script>

<script>
    window.HowShow=1;
    save_how_show =function(value)
    {
        HowShow=value
    }
</script>

<script>
    window.WherePlayed=3;
    save_where_played =function(value)
    {
        WherePlayed=value
    }
</script>

<script>
    window.AllStatsSet=new Set()
    window.AllStatsArray=[]
    save_stat=function (value, flag)
    {
        if(flag)
        {
            AllStatsSet.add(value)
        }
        else
        {
            AllStatsSet.delete(value)
        }
        AllStatsArray=[...AllStatsSet]
    }
</script>


<div class="fixed-bottom d-flex justify-content-center mb-3">
    <button class="btn btn-primary"
    hx-post="/stats/team"
    hx-ext="json-enc"
    hx-vals='js:{
            name: "Team 40",
            team_id: TeamId,
            matches_count: MatchCount,
            where_played: WherePlayed,
            how_show: HowShow,
            stats: AllStatsArray
        }'
    hx-target="#dis-res"
    style="">
    Посмотреть статистику
</button>
</div>

    </div>
 <div class="d-flex justify-content-between align-items-start gap-4">

        <div style="min-width: 200px;">
            <label for="teams" class="mb-2">Выберите команду</label>
            <select id="teams" name="teams" class="form-select mb-3" onchange="save(this.value)">
                {% for item in teams %}
                    <option value="{{ item }}">{{ teams[item] }}</option>
                {% endfor %}
            </select>
            <img class="img-fluid d-block mx-auto mb-2" id="team_logo" src="" style="max-height: 100px;">
            <div class="text-start" id="dis-res"></div>
        </div>

        <div class="d-flex gap-3 flex-wrap justify-content-center">
            <div>
                <label for="count" class="mb-2">Кол-во матчей</label>
                <select id="count" name="count" class="form-select" onchange="save_count(this.value)">
                    {% for i in range(1,38) %}
                        <option value="{{i}}">{{i}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-2">Как показать</label>
                <select class="form-select" onchange="save_how_show(this.value)">
                    <option value="{{1}}">AVG</option>
                    <option value="{{2}}">MIN</option>
                    <option value="{{3}}">MAX</option>
                </select>
            </div>
            <div>
                <label class="mb-2">Дома/в гостях</label>
                <select class="form-select" onchange="save_where_played(this.value)">
                    <option value="{{3}}">Все</option>
                    <option value="{{1}}">Дома</option>
                    <option value="{{2}}">В гостях</option>
                </select>
            </div>
        </div>

        <div class="d-flex flex-column gap-2 text-end" style="min-width: 200px;">
            <div>
                <label>
                    <input type="checkbox" value="shots" onchange="save_stat(this.value, this.checked)"> Удары
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="shots_on_goal" onchange="save_stat(this.value, this.checked)"> Удары в створ
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="offsides" onchange="save_stat(this.value, this.checked)"> Оффсайды
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="corners" onchange="save_stat(this.value, this.checked)"> Угловые
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="yellow_cards" onchange="save_stat(this.value, this.checked)"> Желтые карточки
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="red_cards" onchange="save_stat(this.value, this.checked)"> Красные карточки
                </label>
            </div>
            <div>
                <label>
                    <input type="checkbox" value="possession" onchange="save_stat(this.value, this.checked)"> Владение мячом
                </label>
            </div>
        </div>

    </div>
</div>



</body>
</html>
