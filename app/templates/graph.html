<!DOCTYPE html>
<html lang="ru">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
        <meta charset="UTF-8">
        <script src="/static/htmx.min.js"></script>
        <script src="/static/json-enc.js"></script>
        <script src="/static/chart.umd.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <title>Я сварил не то</title>
</head>
<body>
<div class="logo-box">
<img class="justify-content-start" src="{{ url_for('static', path='/images/Premier_League_Logo.webp') }}"
     style="max-height: 100px;">
    <div class="buttons">
        <button class="my-button" >Форма команды</button>
        <a class="my-button" href="/compare">Сравнение команды</a>
    </div>
</div>
<div class="container mt-5">
<script>
    window.TeamId=41;
    function save(value, teamsJson)
    {
        const teams = JSON.parse(teamsJson);
        TeamId=value
        const img=document.getElementById("team_logo");
        img.src = "https://media.api-sports.io/football/teams/" + value + ".png";
        document.getElementById("team_logo_text").textContent=teams[value];

    }
</script>

<script>
    window.MatchCount=1
    save_count=function (value)
    {
        MatchCount=value
    }
</script>

<script>
    window.HowShow=1;
    save_how_show =function(value)
    {
        HowShow=value
    }
</script>

<script>
    window.WherePlayed=3;
    save_where_played =function(value)
    {
        WherePlayed=value
    }
</script>

<script>
    window.CurrStat="";
    window.AllStatArray=[]
    save_stat=function (value, flag)
    {
        if(window.CurrStat!="") {
                document.getElementById(window.CurrStat).checked = false;
            }
        if(flag) {
            window.CurrStat=value;
        }
        window.AllStatArray=[window.CurrStat];
    }
</script>
<script>
    const trans = {
        "shots": "Удары",
        "shots_on_goal": "Удары в створ",
        "offsides": "Оффсайды",
        "corners": "Угловые",
        "yellow_cards": "Желтые карточки",
        "red_cards": "Красные карточки",
        "possession": "Владение мячом"
    };
    const icons = {
    "shots": "{{ url_for('static', path='/images/shot.png') }}",
    "shots_on_goal": "{{ url_for('static', path='/images/shot-on-target.png') }}",
    "offsides": "{{ url_for('static', path='/images/offside.png') }}",
    "corners": "{{ url_for('static', path='/images/corner.png') }}",
    "yellow_cards": "{{ url_for('static', path='/images/yellow-card.png') }}",
    "red_cards": "{{ url_for('static', path='/images/red-card.png') }}",
    "possession": "{{ url_for('static', path='/images/possession.svg') }}"
};
    PutStat=function (event)
    {
        const data = JSON.parse(event.detail.xhr.responseText);
        const ctx = document.getElementById('13').getContext('2d');

    const myChart = new Chart(ctx, {
      type: 'line', // Тип графика: line, bar, pie и т.д.
      data: {
        labels: ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь'],
        datasets: [{
          label: 'Продажи за полугодие',
          data: [12, 19, 3, 5, 2, 3],
          backgroundColor: 'rgba(54, 162, 235, 0.2)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 2,
          tension: 0.4 // Плавность линии
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
    }
</script>



    </div>
 <div class="d-flex justify-content-between align-items-start gap-4">
        <div style="min-width: 200px;">
            <label for="teams" class="mb-2">Выберите команду</label>
            <select id="teams" name="teams" class=" my-button form-select mb-3" data-teams='{{ teams | tojson }}' onchange="save(this.value, this.dataset.teams)">
                {% for item in teams %}
                    <option value="{{ item }}">{{ teams[item] }}</option>
                {% endfor %}
            </select>
    <div class="card custom-card p-4 d-flex align-items-center">
            <img class="img-fluid d-block mx-auto mb-2" id="team_logo" src="" style="max-height: 70px;">
                <div id="team_logo_text" class="number-style">
                    </div>
            </div>
        </div>

        <div class="d-flex gap-3 flex-wrap justify-content-center">
            <div>
                <label for="count" class="mb-2">Кол-во матчей</label>
                <select id="count" name="count" class="my-button form-select" onchange="save_count(this.value)">
                    {% for i in range(5,38) %}
                        <option value="{{i}}">{{i}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-2">Как показать</label>
                <select class="my-button form-select" onchange="save_how_show(this.value)">
                    <option value="{{1}}">AVG</option>
                    <option value="{{2}}">MIN</option>
                    <option value="{{3}}">MAX</option>
                </select>
            </div>
            <div>
                <label class="mb-2">Дома/в гостях</label>
                <select class="my-button form-select" onchange="save_where_played(this.value)">
                    <option value="{{3}}">Все</option>
                    <option value="{{1}}">Дома</option>
                    <option value="{{2}}">В гостях</option>
                </select>
            </div>
        </div>
<div class="d-flex justify-content-center mb-3" style="margin-top: 29px;">
    <button class="my-button"
    hx-post="/stats/team"
    hx-ext="json-enc"
     hx-swap="none"
    hx-vals='js:{
            name: "Team 40",
            team_id: TeamId,
            matches_count: MatchCount,
            where_played: WherePlayed,
            how_show: HowShow,
            stats: AllStatArray
        }'
    hx-on::after-request="PutStat(event)"
    style="">
    Посмотреть статистику
</button>
</div>
        <div class="d-flex flex-column gap-2 text-end" style="min-width: 200px;">
            <div>
                <label>
                    <input id="shots" type="checkbox" value="shots" onchange="save_stat(this.value, this.checked)"> Удары
                </label>
            </div>
            <div>
                <label>
                    <input id="shots_on_goal" type="checkbox" value="shots_on_goal" onchange="save_stat(this.value, this.checked)"> Удары в створ
                </label>
            </div>
            <div>
                <label>
                    <input id="offsides" type="checkbox" value="offsides" onchange="save_stat(this.value, this.checked)"> Оффсайды
                </label>
            </div>
            <div>
                <label>
                    <input id="corners" type="checkbox" value="corners" onchange="save_stat(this.value, this.checked)"> Угловые
                </label>
            </div>
            <div>
                <label>
                    <input id="yellow_cards" type="checkbox" value="yellow_cards" onchange="save_stat(this.value, this.checked)"> Желтые карточки
                </label>
            </div>
            <div>
                <label>
                    <input id="red_cards" type="checkbox" value="red_cards" onchange="save_stat(this.value, this.checked)"> Красные карточки
                </label>
            </div>
            <div>
                <label>
                    <input id="possession" type="checkbox" value="possession" onchange="save_stat(this.value, this.checked)"> Владение мячом
                </label>
            </div>
        </div>
    </div>
</div>

<div class="box-for-stat">
  <div class="stat-box">
    <div id="6" class="text-center stat-style"></div>
    <canvas id="13" class="number-style text-center"></canvas>
      <div id="20"></div>
  </div>
</div>
</div>
</body>
</html>
