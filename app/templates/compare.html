<script>
    window.Is_chage=false;

</script>

<script>
    window.AllStatsSet=new Set()
    window.AllStatsArray=[]
    save_stat=function (value, flag)
    {
        if(flag)
        {
            AllStatsSet.add(value)
        }
        else
        {
            AllStatsSet.delete(value)
        }
        AllStatsArray=[...AllStatsSet]
    }
</script>
<script>
    const trans = {
        "shots": "Удары",
        "shots_on_goal": "Удары в створ",
        "offsides": "Оффсайды",
        "corners": "Угловые",
        "yellow_cards": "Желтые карточки",
        "red_cards": "Красные карточки",
        "possession": "Владение мячом"
    };
    const reverse_trans=
        {
    "Удары": "shots",
    "Удары в створ": "shots_on_goal",
    "Оффсайды": "offsides",
    "Угловые": "corners",
    "Желтые карточки": "yellow_cards",
    "Красные карточки": "red_cards",
    "Владение мячом": "possession"
};
    const icons = {
    "shots": "{{ url_for('static', path='/images/shot.png') }}",
    "shots_on_goal": "{{ url_for('static', path='/images/shot-on-target.png') }}",
    "offsides": "{{ url_for('static', path='/images/offside.png') }}",
    "corners": "{{ url_for('static', path='/images/corner.png') }}",
    "yellow_cards": "{{ url_for('static', path='/images/yellow-card.png') }}",
    "red_cards": "{{ url_for('static', path='/images/red-card.png') }}",
    "possession": "{{ url_for('static', path='/images/possession.svg') }}"
};
    PutStat=function (event)
    {
        const array = JSON.parse(event.detail.xhr.responseText);
        const who_win=array[0];
        const data=array[1];
        const data_2=array[2];
        let n=7;
        let k=0;
        let count=0;
        for (let i=0;i<7;i++) {
            if(i<AllStatsArray.length) {
                if(AllStatsArray[i]=="possession")
                {
                     document.getElementById("6").textContent = trans[AllStatsArray[i]];
                     document.getElementById("13").textContent =data[i]+"%";
                     document.getElementById("27").textContent =data_2[i]+"%";
                     if(who_win[i]==0)
                     {

                         document.getElementById("13").style.color="green";
                         document.getElementById("27").style.color="red";
                     }
                     else if(who_win[i]==1)
                     {
                         document.getElementById("13").style.color="red";
                         document.getElementById("27").style.color="green";
                     }
                     else
                     {
                         document.getElementById("13").style.color="yellow";
                         document.getElementById("27").style.color="yellow";
                     }
                     const box = document.getElementById("20");
                      if(box.childElementCount==0) {
                          const img = document.createElement("img");
                          img.src = "{{ url_for('static', path='/images/possession.png') }}";
                          img.className = "stat-icon-compare";
                          box.appendChild(img);
                      }
                }
                else {
                    const statName = AllStatsArray[i];
                    const textDiv = document.getElementById(k.toString())
                    const box = document.getElementById((k + 14).toString());

                    if(box.childElementCount==0|| statName!=reverse_trans[textDiv.textContent] || window.Is_chage) {
                        document.getElementById((k + 7).toString()).textContent = data[i];
                        document.getElementById((k + 21).toString()).textContent = data_2[i];
                        if(who_win[i]==0)
                     {

                         document.getElementById((k + 7).toString()).style.color="green";
                         document.getElementById((k + 21).toString()).style.color="red";
                     }
                     else if(who_win[i]==1)
                     {
                         document.getElementById((k + 7).toString()).style.color="red";
                         document.getElementById((k + 21).toString()).style.color="green";
                     }
                     else
                     {
                         document.getElementById((k + 7).toString()).style.color="yellow";
                         document.getElementById((k + 21).toString()).style.color="yellow";
                     }
                        textDiv.textContent = trans[statName];

                        if (box.childElementCount!= 0) {
                            document.getElementById("id_to_remove"+k.toString()).remove();
                        }
                        const img = document.createElement("img");
                            img.src = icons[statName];
                            img.id="id_to_remove"+k.toString();
                            img.className = "stat-icon-compare";
                            box.appendChild(img);

                    }
                        k++;

                }
            }
            else{
                document.getElementById(k.toString()).textContent = "";
                document.getElementById((k+7).toString()).textContent="";
                document.getElementById((k+21).toString()).textContent="";
                document.getElementById((k+14).toString()).textContent="";
                k++;
            }
        }
        window.Is_chage=false;
    }

</script>
